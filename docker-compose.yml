
services:
  postgres:
    image: postgres:15
    container_name: flowable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flow10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flowable-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: flowable-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - flowable-net

  flowable:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: curso-flowable-personalizado:6.8.0
    container_name: flowable-persistente
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING.DATASOURCE.URL=jdbc:postgresql://flowable-postgres:5432/flowable
      - SPRING.DATASOURCE.USERNAME=flowable
      - SPRING.DATASOURCE.PASSWORD=flow10
      - DB_PASSWORD=flow10
      - FLOWABLE_INTEGRATION_SECRET=clave-demo-gestion-cursos-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowable-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  flowable-net:
    driver: bridge
