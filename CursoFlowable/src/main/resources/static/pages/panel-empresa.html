<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis cursos - Institución de Capacitación</title>

    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="/css/panel-empresa.css">
</head>

<body>

    <header class="encabezado">
        <div class="contenedor navegacion">

            <a href="/index.html" class="marca">
                <span class="logo">🎓</span>
                <span>Institución de Capacitación</span>
            </a>

            <nav class="menu">

                <a href="/pages/panel-empresa.html">
                    Mis cursos
                </a>

                <a href="#" class="boton-login" onclick="cerrarSesion(event)">
                    Cerrar sesión
                </a>

            </nav>

        </div>
    </header>

    <main class="contenedor panel-empresa">

        <section class="bienvenida">

            <h1>Panel de empresa</h1>

            <p>
                Consultá tus capacitaciones y el estado
                de cada solicitud.
            </p>

        </section>

        <section class="seccion-cursos">

            <h2>Mis cursos</h2>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Participantes</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="lista-cursos">

                        <tr>
                            <td colspan="4">Cargando cursos...</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Institución de Capacitación - 2026</p>
    </footer>

    <script>

        // ==========================================
        // CERRAR SESION
        // ==========================================

        async function cerrarSesion(event) {

            event.preventDefault();

            try {

                const respuesta = await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

                if (respuesta.ok) {

                    window.location.replace("/pages/login.html");

                } else {

                    alert("No se pudo cerrar la sesión.");

                }

            } catch (error) {

                console.error("Error al cerrar sesión:", error);
                alert("Error de conexión con el servidor.");

            }

        }


        // ==========================================
        // CARGAR LOS CURSOS DE LA EMPRESA
        // ==========================================

        async function cargarCursos() {

            const tabla = document.getElementById("lista-cursos");

            try {

                // Consultar los cursos de la empresa autenticada
                const respuesta = await fetch("/api/empresas/mis-cursos", {
                    credentials: "same-origin",
                    cache: "no-store"
                });

                // Verificar si existe una sesion activa
                if (respuesta.status === 401 || respuesta.status === 403) {

                    window.location.replace("/pages/login.html");
                    return;

                }

                if (!respuesta.ok) {

                    throw new Error("No se pudieron obtener los cursos");

                }

                // Obtener los cursos devueltos por el backend
                const cursos = await respuesta.json();

                console.log("Cursos de la empresa:", cursos);

                // Limpiar el contenido de la tabla
                tabla.innerHTML = "";


                // Si la empresa no tiene cursos registrados
                if (cursos.length === 0) {

                    mostrarMensajeTabla("No tenés cursos registrados.");

                    return;

                }


                // Recorrer todos los cursos de la empresa
                cursos.forEach(curso => {

                    const fila = document.createElement("tr");


                    // ------------------------------------------
                    // TEMATICA DEL CURSO
                    // ------------------------------------------

                    const tematica = document.createElement("td");

                    tematica.textContent = curso.tematica;


                    // ------------------------------------------
                    // CANTIDAD DE PARTICIPANTES
                    // ------------------------------------------

                    const participantes = document.createElement("td");

                    participantes.textContent =
                        curso.cantidad_participantes;


                    // ------------------------------------------
                    // ESTADO DEL CURSO
                    // ------------------------------------------

                    const estado = document.createElement("td");

                    const etiqueta = document.createElement("span");

                    etiqueta.classList.add("estado");

                    etiqueta.textContent = formatearEstado(curso.estado);

                    // Aplicar los estilos existentes segun el estado
                    const claseEstado = obtenerClaseEstado(curso.estado);

                    if (claseEstado) {

                        etiqueta.classList.add(claseEstado);

                    }

                    estado.appendChild(etiqueta);


                    // ------------------------------------------
                    // BOTON VER DETALLES
                    // ------------------------------------------

                    const acciones = document.createElement("td");

                    const enlace = document.createElement("a");

                    enlace.classList.add("boton-detalle");

                    enlace.textContent = "Ver detalles";

                    enlace.href =
                        `/pages/detalle-curso.html?id=${encodeURIComponent(curso.id)}`;

                    acciones.appendChild(enlace);


                    // ------------------------------------------
                    // AGREGAR LAS COLUMNAS A LA FILA
                    // ------------------------------------------

                    fila.appendChild(tematica);
                    fila.appendChild(participantes);
                    fila.appendChild(estado);
                    fila.appendChild(acciones);

                    // Agregar la fila a la tabla
                    tabla.appendChild(fila);

                });

            } catch (error) {

                console.error("Error al cargar los cursos:", error);

                mostrarMensajeTabla("Error al cargar los cursos.");

            }

        }


        // ==========================================
        // FORMATEAR EL ESTADO DEL CURSO
        // ==========================================

        function formatearEstado(estado) {

            if (!estado) {

                return "Sin estado";

            }

            // Reemplazar los guiones bajos por espacios
            const texto = estado.replace(/_/g, " ");

            // Convertir la primera letra en mayuscula
            return texto.charAt(0).toUpperCase() + texto.slice(1);

        }


        // ==========================================
        // OBTENER EL ESTILO DEL ESTADO
        // ==========================================

        function obtenerClaseEstado(estado) {

            switch (estado) {

                case "en_evaluacion":
                case "en_negociacion":
                    return "negociacion";

                case "en_preparacion":
                    return "preparacion";

                case "finalizado":
                    return "finalizado";

                default:
                    return "";

            }

        }


        // ==========================================
        // MOSTRAR MENSAJES EN LA TABLA
        // ==========================================

        function mostrarMensajeTabla(mensaje) {

            const tabla = document.getElementById("lista-cursos");

            tabla.innerHTML = "";

            const fila = document.createElement("tr");

            const celda = document.createElement("td");

            celda.colSpan = 4;

            celda.textContent = mensaje;

            fila.appendChild(celda);

            tabla.appendChild(fila);

        }


        // ==========================================
        // CARGAR LOS CURSOS AL ABRIR LA PAGINA
        // ==========================================

        document.addEventListener("DOMContentLoaded", cargarCursos);

    </script>

</body>

</html>
